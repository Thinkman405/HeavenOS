[package]
name = "crystallisation"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "NEOS application data translation: flat media into 3D/4D resonant shapes"

build = "build.rs"

[dependencies]
lattice = { path = "../lattice" }
substrate = { path = "../substrate" }

[build-dependencies]
serde_json = "1"

# Physics assertions live at neos/tests/ per _spec/target-tree.md.
[[test]]
name = "crystallisation"
path = "../tests/crystallisation.rs"

[[test]]
name = "crystallisation_timecrystal"
path = "../tests/crystallisation_timecrystal.rs"

[[test]]
name = "crystallisation_codec"
path = "../tests/crystallisation_codec.rs"

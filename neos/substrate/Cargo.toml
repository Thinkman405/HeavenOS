[package]
name = "substrate"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "NEOS Tier 1: the Rust hypervisor, non-Euclidean memory, and binary-wave translation"
build = "build.rs"

[dependencies]
lattice = { path = "../lattice" }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
# The test suite cross-checks the pool's metric against lattice's own, and
# asserts that symphony-kernel re-exports these frequency types rather than
# defining its own.
symphony-kernel = { path = "../symphony/kernel" }

[[bin]]
name = "neos-substrate"
path = "src/main.rs"

# Physics assertions live at neos/tests/ per _spec/target-tree.md.
[[test]]
name = "substrate"
path = "../tests/substrate.rs"
